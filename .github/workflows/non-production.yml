name: Non-Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: non-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build_and_push:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_HARDENED_MODE: 0

    steps:
      # GitHub - Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Setup Node
      # https://github.com/marketplace/actions/setup-node-js-environment

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.x
          cache: "yarn"
          cache-dependency-path: |
            app/yarn.lock
            app/package.json

      - name: Yarn install
        working-directory: app
        run: |
          yarn install --immutable
          yarn tsc
          yarn build:backend

      # Google Cloud Platform - Create Credentials
      # https://github.com/marketplace/actions/authenticate-to-google-cloud

      - name: Create credentials
        id: create_credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          service_account: plt-backstage-github@plt-lz-backend-tf69-prod.iam.gserviceaccount.com
          workload_identity_provider: projects/557265520053/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
          access_token_lifetime: 300s

      # Docker Buildx
      # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Docker Login
      # https://github.com/marketplace/actions/docker-login

      - name: Login to Google Artifact Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.create_credentials.outputs.access_token }}

      # Build and Push Docker to Google Artifact Registry
      # https://github.com/marketplace/actions/build-and-push-docker-images

      - name: Build and push to Google Artifact Registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          tags: us-docker.pkg.dev/plt-lz-services-tf79-prod/plt-docker-standard/backstage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./app
          file: ./app/packages/backend/Dockerfile
          build-args: |
            DD_GIT_REPOSITORY_URL=https://github.com/${{ github.repository }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
          push: true

  main:
    name: "Main"
    uses: osinfra-io/pt-techne-opentofu-workflows/.github/workflows/plan-and-apply.yml@35773c9889c3192ada62856f811225fb5410565a # v0.4.1
    if: github.event.head_commit.author.username != 'dependabot[bot]'
    needs: build_and_push
    with:
      checkout_ref: ${{ github.ref }}
      github_environment: "Non-Production: Main"
      service_account: plt-backstage-github@plt-lz-backend-tf69-prod.iam.gserviceaccount.com
      opentofu_kms_encryption_key: projects/plt-lz-backend-tf69-prod/locations/us/keyRings/state-encryption/cryptoKeys/default
      opentofu_plan_args: -var-file=tfvars/non-production.tfvars
      opentofu_state_bucket: plt-backstage-53a5-prod
      opentofu_version: ${{ vars.OPENTOFU_VERSION }}
      opentofu_workspace: main-non-production
      working_directory: deployments
      workload_identity_provider: projects/557265520053/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
    secrets:
      opentofu_plan_secret_args: >-
        -var=datadog_api_key=${{ secrets.DATADOG_API_KEY }}
        -var=datadog_app_key=${{ secrets.DATADOG_APP_KEY }}

  us_east1_b:
    name: "Non-Production Regional: us-east1-b"
    uses: osinfra-io/pt-techne-opentofu-workflows/.github/workflows/plan-and-apply.yml@35773c9889c3192ada62856f811225fb5410565a # v0.4.1
    if: github.event.head_commit.author.username != 'dependabot[bot]'
    needs: main
    with:
      checkout_ref: ${{ github.ref }}
      github_environment: "Non-Production: Regional - us-east1-b"
      service_account: plt-backstage-github@plt-lz-backend-tf69-prod.iam.gserviceaccount.com
      opentofu_kms_encryption_key: projects/plt-lz-backend-tf69-prod/locations/us/keyRings/state-encryption/cryptoKeys/default
      opentofu_plan_args: -var-file=tfvars/us-east1-b-non-production.tfvars -var=backstage_version=${{ github.sha }}
      opentofu_state_bucket: plt-backstage-53a5-prod
      opentofu_version: ${{ vars.OPENTOFU_VERSION }}
      opentofu_workspace: us-east1-b-non-production
      working_directory: deployments/regional
      workload_identity_provider: projects/557265520053/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
    secrets:
      opentofu_plan_secret_args: >-
        -var=datadog_api_key=${{ secrets.DATADOG_API_KEY }}
        -var=datadog_app_key=${{ secrets.DATADOG_APP_KEY }}
        -var=github_app_client_secret=${{ secrets.APP_CLIENT_SECRET }}
        -var=github_app_private_key=${{ secrets.APP_PRIVATE_KEY }}
        -var=github_app_webhook_secret=${{ secrets.APP_WEBHOOK_SECRET }}
        -var=github_auth_client_secret=${{ secrets.AUTH_CLIENT_SECRET }}

  datadog_synthetic_tests:
    name: "Non-Production: Datadog synthetic tests"
    runs-on: ubuntu-latest
    needs: us_east1_b
    steps:
      # Datadog Synthetics CI
      # https://github.com/marketplace/actions/datadog-synthetics-ci

      - name: Run Datadog synthetic tests
        uses: datadog/synthetics-ci-github-action@c84a23515bda46d8a060f77a6ad88644377f90be # v4.0.0
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          app-key: ${{ secrets.DATADOG_APP_KEY }}
          fail-on-critical-errors: true
          test-search-query: "env:non-production service:backstage team:platform-backstage state:live"
